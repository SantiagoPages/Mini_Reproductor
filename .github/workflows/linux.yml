# Construye los paquetes de Ubuntu (.deb y .AppImage) en un servidor de GitHub.
# Se ejecuta de dos maneras:
#   1. A mano: pestaña "Actions" > "Paquetes de Ubuntu" > "Run workflow". Los archivos quedan para descargar
#      al final de esa ejecución (sección "Artifacts").
#   2. Automáticamente al publicar una release: los paquetes se adjuntan solos a esa release unos minutos después.
# No usa ninguna clave: en Linux no hace falta la firma de EVS (Widevine solo la exige en Windows y macOS).
name: Paquetes de Ubuntu

on:
  workflow_dispatch:
  release:
    types: [published]

# Permiso de escritura solo para poder adjuntar los archivos a la release.
permissions:
  contents: write

jobs:
  linux:
    # Ubuntu 22.04: los paquetes generados funcionan también en versiones posteriores.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Construir los paquetes
        run: bash construir.sh

      - name: Guardar los paquetes para descargar
        uses: actions/upload-artifact@v4
        with:
          name: paquetes-ubuntu
          path: |
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: error

      - name: Adjuntar los paquetes a la release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.deb dist/*.AppImage --clobber
